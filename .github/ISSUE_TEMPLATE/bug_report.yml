name: Bug report
description: Report a reproducible problem in Nyala Studio
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, database contents, private paths, or unpatched
        security details. Use the private Security Advisory link for vulnerabilities.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, connection URLs, query results, and other sensitive data.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connections
        - Metadata explorer
        - SQL editor and execution
        - Result panel
        - History and advanced SQL tools
        - Packaging and startup
        - Workbench shell
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version or commit SHA where the problem occurs.
      placeholder: e.g. mvp at 0123abcd
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Add relevant logs or screenshots only after removing sensitive data.
