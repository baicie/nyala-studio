name: SQL MVP Gate

on:
  push:
    branches: [mvp]
  pull_request:
    branches: [mvp]
  workflow_call:
    inputs:
      run_mysql_integration:
        description: 'Run the opt-in MySQL 8 integration test'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_mysql_integration:
        description: 'Run the opt-in MySQL 8 integration test'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  verify:
    name: Lint, build, and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build frontend
        run: pnpm run build

      - name: Check Rust formatting
        run: pnpm run rust:fmt

      - name: Check Rust
        run: pnpm run rust:check

      - name: Lint Rust
        run: pnpm run rust:clippy

      - name: Run tests
        run: pnpm run test

  mysql-integration:
    name: MySQL 8 integration
    if: ${{ inputs.run_mysql_integration }}
    needs: verify
    runs-on: ubuntu-22.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: nyala_test
          MYSQL_USER: nyala
          MYSQL_PASSWORD: nyala_ci_password
          MYSQL_ROOT_PASSWORD: nyala_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pnyala_ci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NYALA_TEST_MYSQL_HOST: 127.0.0.1
      NYALA_TEST_MYSQL_PORT: 3306
      NYALA_TEST_MYSQL_DATABASE: nyala_test
      NYALA_TEST_MYSQL_USERNAME: nyala
      NYALA_TEST_MYSQL_PASSWORD: nyala_ci_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: '. -> target'

      - name: Run MySQL integration test
        run: pnpm run test:mysql-integration
