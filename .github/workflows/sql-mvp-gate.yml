name: SQL MVP Gate

on:
  push:
    branches: [main, mvp]
  pull_request:
    branches: [main, mvp]
  workflow_call:
    inputs:
      run_mysql_integration:
        description: 'Run the opt-in MySQL 8 integration test'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_mysql_integration:
        description: 'Run the opt-in MySQL 8 integration test'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  verify:
    name: Lint, build, and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build frontend
        run: pnpm run build

      - name: Check Rust formatting
        run: pnpm run rust:fmt

      - name: Check Rust
        run: pnpm run rust:check

      - name: Lint Rust
        run: pnpm run rust:clippy

      - name: Run tests
        run: pnpm run test

  mysql-integration:
    name: MySQL 8 integration
    if: ${{ inputs.run_mysql_integration }}
    needs: verify
    runs-on: ubuntu-22.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: nyala_test
          MYSQL_USER: nyala
          MYSQL_PASSWORD: nyala_ci_password
          MYSQL_ROOT_PASSWORD: nyala_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pnyala_ci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NYALA_TEST_MYSQL_HOST: 127.0.0.1
      NYALA_TEST_MYSQL_PORT: 3306
      NYALA_TEST_MYSQL_DATABASE: nyala_test
      NYALA_TEST_MYSQL_USERNAME: nyala
      NYALA_TEST_MYSQL_PASSWORD: nyala_ci_password
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Run MySQL integration test
        run: pnpm run test:mysql-integration
