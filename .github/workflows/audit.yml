name: Security Audit

on:
  push:
    branches: [mvp]
    paths:
      - '.github/workflows/audit.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src-tauri/Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'sidex-extension-sdk/Cargo.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'infrastructure/marketplace-proxy/package.json'
      - 'infrastructure/marketplace-proxy/package-lock.json'
  pull_request:
    branches: [mvp]
    paths:
      - '.github/workflows/audit.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src-tauri/Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'sidex-extension-sdk/Cargo.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'infrastructure/marketplace-proxy/package.json'
      - 'infrastructure/marketplace-proxy/package-lock.json'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # Tauri's Linux GTK3 stack and build-only HTML parser still carry two
        # upstream advisories. rust_decimal also records optional rkyv 0.7 in
        # Cargo.lock, but no active workspace feature or target enables it
        # (`cargo tree -e features -i rkyv@0.7.46` is empty).
        # Deny every other current or future unsound warning.
        run: >-
          cargo audit --file Cargo.lock --deny unsound
          --ignore RUSTSEC-2024-0429
          --ignore RUSTSEC-2026-0097
          --ignore RUSTSEC-2026-0235

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=low

  proxy-audit:
    name: marketplace proxy npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/marketplace-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infrastructure/marketplace-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=low
