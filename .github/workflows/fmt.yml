name: Formatting

on:
  push:
    branches: [mvp]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.3'
          cache: false

      - name: Install actionlint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint/bin"
          GOBIN="$RUNNER_TEMP/actionlint/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate GitHub Actions workflows
        shell: bash
        run: '"$RUNNER_TEMP/actionlint/bin/actionlint" -no-color -shellcheck "" -pyflakes ""'

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect changed source files
        id: prettier-files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi

          files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.ts|*.tsx|*.js|*.json) files+=("$file") ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$base_sha" "$GITHUB_SHA" -- src)

          printf '%s\0' "${files[@]}" > "$RUNNER_TEMP/prettier-files"
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        if: steps.prettier-files.outputs.count != '0'
        shell: bash
        run: xargs -0 pnpm exec prettier --check < "$RUNNER_TEMP/prettier-files"

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  taplo:
    name: taplo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install taplo
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: taplo-cli

      - name: Check TOML formatting
        run: taplo fmt --check --diff
