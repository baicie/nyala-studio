name: Formatting

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: fmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect changed source files
        id: prettier-files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi

          files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.ts|*.tsx|*.js|*.json) files+=("$file") ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$base_sha" "$GITHUB_SHA" -- src)

          printf '%s\0' "${files[@]}" > "$RUNNER_TEMP/prettier-files"
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        if: steps.prettier-files.outputs.count != '0'
        shell: bash
        run: xargs -0 pnpm exec prettier --check < "$RUNNER_TEMP/prettier-files"

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  taplo:
    name: taplo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Check TOML formatting
        run: taplo fmt --check --diff
