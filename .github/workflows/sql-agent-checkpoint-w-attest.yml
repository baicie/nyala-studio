name: SQL Agent Checkpoint W Attestation

on:
  workflow_dispatch:
    inputs:
      capture_run_id:
        description: 'Completed SQL Agent Native Workbench Capture run ID'
        required: true
        type: string
      attest_macos_keyboard:
        description: 'I completed the real macOS keyboard walkthrough for the captured revision'
        required: true
        default: false
        type: boolean
      macos_keyboard_evidence_ref:
        description: 'Credential-free HTTPS or qa:// evidence reference for the macOS keyboard walkthrough'
        required: true
        type: string
      attest_voiceover:
        description: 'I completed the real VoiceOver walkthrough for the captured revision'
        required: true
        default: false
        type: boolean
      voiceover_evidence_ref:
        description: 'Credential-free HTTPS or qa:// evidence reference for the VoiceOver walkthrough'
        required: true
        type: string
      attest_windows_keyboard:
        description: 'I completed the real Windows keyboard walkthrough for the captured revision'
        required: true
        default: false
        type: boolean
      windows_keyboard_evidence_ref:
        description: 'Credential-free HTTPS or qa:// evidence reference for the Windows keyboard walkthrough'
        required: true
        type: string
      attest_narrator:
        description: 'I completed the real Narrator walkthrough for the captured revision'
        required: true
        default: false
        type: boolean
      narrator_evidence_ref:
        description: 'Credential-free HTTPS or qa:// evidence reference for the Narrator walkthrough'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: sql-agent-checkpoint-w-attest-${{ inputs.capture_run_id }}
  cancel-in-progress: false

jobs:
  attest-checkpoint-w:
    name: Attest and verify captured native evidence
    if: github.ref_protected == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: sql-agent-checkpoint-w
    env:
      CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ATTEST_MACOS_KEYBOARD: ${{ inputs.attest_macos_keyboard }}
      MACOS_KEYBOARD_EVIDENCE_REF: ${{ inputs.macos_keyboard_evidence_ref }}
      ATTEST_VOICEOVER: ${{ inputs.attest_voiceover }}
      VOICEOVER_EVIDENCE_REF: ${{ inputs.voiceover_evidence_ref }}
      ATTEST_WINDOWS_KEYBOARD: ${{ inputs.attest_windows_keyboard }}
      WINDOWS_KEYBOARD_EVIDENCE_REF: ${{ inputs.windows_keyboard_evidence_ref }}
      ATTEST_NARRATOR: ${{ inputs.attest_narrator }}
      NARRATOR_EVIDENCE_REF: ${{ inputs.narrator_evidence_ref }}
    steps:
      - name: Initialize Checkpoint W evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/sql-agent-checkpoint-w"
          node -e "const fs=require('node:fs');const p=process.env.RUNNER_TEMP+'/sql-agent-checkpoint-w/phase-a4-checkpoint-w.json';fs.writeFileSync(p,JSON.stringify({version:2,generatedAt:new Date().toISOString(),decision:'NO-GO',checks:[],blockers:['The Checkpoint W attestation workflow did not complete.']},null,2)+'\n')"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify protected default-branch source
        run: |
          test "$GITHUB_REF_PROTECTED" = "true" || {
            echo 'Attestation requires a branch protected by GitHub rules.' >&2
            exit 1
          }
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || {
            echo 'Attestation must run from the protected default branch.' >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo 'Default branch moved after the attestation run was dispatched; rerun against the current revision.' >&2
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Fetch immutable capture run metadata
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$CAPTURE_RUN_ID" in
            ''|*[!0-9]*) echo 'capture_run_id must be a positive integer' >&2; exit 1 ;;
          esac
          curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer $GH_API_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN_ID" \
            --output "$RUNNER_TEMP/sql-agent-checkpoint-w/capture-run-api.json"
          curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer $GH_API_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN_ID/artifacts?per_page=100" \
            --output "$RUNNER_TEMP/sql-agent-checkpoint-w/capture-artifacts-api.json"

      - id: capture-run
        name: Verify immutable capture run metadata
        run: |
          node scripts/verify-sql-agent-capture-run.mjs \
            --run-metadata "$RUNNER_TEMP/sql-agent-checkpoint-w/capture-run-api.json" \
            --artifact-metadata "$RUNNER_TEMP/sql-agent-checkpoint-w/capture-artifacts-api.json" \
            --output "$RUNNER_TEMP/sql-agent-checkpoint-w/capture-run.json" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$CAPTURE_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download native evidence from the reviewed capture run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.capture_run_id }}
          artifact-ids: ${{ steps.capture-run.outputs.artifact_ids }}
          path: ${{ runner.temp }}/sql-agent-checkpoint-w
          merge-multiple: false

      - name: Resolve immutable capture provenance
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join(process.env.RUNNER_TEMP, 'sql-agent-checkpoint-w');
          const read = platform => JSON.parse(fs.readFileSync(path.join(root, `sql-agent-native-${platform}`, 'workbench-evidence.json'), 'utf8'));
          const capture = JSON.parse(fs.readFileSync(path.join(root, 'capture-run.json'), 'utf8'));
          const macos = read('macos').provenance;
          const windows = read('windows').provenance;
          const fields = ['repository', 'sourceRevision', 'sourceRef', 'workflowRunId', 'workflowRunAttempt'];
          for (const field of fields) {
            if (macos?.[field] !== windows?.[field]) throw new Error(`Native capture provenance mismatch: ${field}`);
            if (macos?.[field] !== capture.provenance?.[field]) throw new Error(`Native capture metadata mismatch: ${field}`);
          }
          if (macos.repository !== process.env.GITHUB_REPOSITORY) throw new Error('Capture repository does not match this repository.');
          if (String(macos.workflowRunId) !== process.env.CAPTURE_RUN_ID) throw new Error('Downloaded artifacts do not belong to the requested capture run.');
          if (!/^[a-f0-9]{40}$/.test(macos.sourceRevision)) throw new Error('Capture source revision is invalid.');
          if (!/^refs\/(heads|tags|pull)\//.test(macos.sourceRef)) throw new Error('Capture source ref is invalid.');
          if (macos.sourceRevision !== process.env.GITHUB_SHA) throw new Error('Capture source revision does not match the protected attestation revision.');
          if (macos.sourceRef !== `refs/heads/${process.env.DEFAULT_BRANCH}` || macos.sourceRef !== process.env.GITHUB_REF) {
            throw new Error('Capture source ref does not match the protected default branch.');
          }
          if (!Number.isInteger(macos.workflowRunAttempt) || macos.workflowRunAttempt < 1) throw new Error('Capture run attempt is invalid.');
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `SOURCE_REVISION=${macos.sourceRevision}`,
            `SOURCE_REF=${macos.sourceRef}`,
            `CAPTURE_RUN_ATTEMPT=${macos.workflowRunAttempt}`,
            ''
          ].join('\n'));
          NODE

      - name: Record revision-bound manual attestation
        run: |
          node scripts/create-sql-agent-checkpoint-w-attestation.mjs \
            --output "$RUNNER_TEMP/sql-agent-checkpoint-w/manual-attestation.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-revision "$SOURCE_REVISION" \
            --source-ref "$SOURCE_REF" \
            --workflow-run-id "$CAPTURE_RUN_ID" \
            --workflow-run-attempt "$CAPTURE_RUN_ATTEMPT" \
            --reviewer "$GITHUB_ACTOR" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN_ID" \
            --attestation-workflow-run-id "$GITHUB_RUN_ID" \
            --attestation-workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --attestation-workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --macos-keyboard "$ATTEST_MACOS_KEYBOARD" \
            --macos-keyboard-evidence-ref "$MACOS_KEYBOARD_EVIDENCE_REF" \
            --voiceover "$ATTEST_VOICEOVER" \
            --voiceover-evidence-ref "$VOICEOVER_EVIDENCE_REF" \
            --windows-keyboard "$ATTEST_WINDOWS_KEYBOARD" \
            --windows-keyboard-evidence-ref "$WINDOWS_KEYBOARD_EVIDENCE_REF" \
            --narrator "$ATTEST_NARRATOR" \
            --narrator-evidence-ref "$NARRATOR_EVIDENCE_REF"

      - id: checkpoint-w
        name: Run fail-closed Checkpoint W gate
        continue-on-error: true
        run: |
          node scripts/verify-sql-agent-checkpoint-w.mjs \
            --macos "$RUNNER_TEMP/sql-agent-checkpoint-w/sql-agent-native-macos/workbench-evidence.json" \
            --windows "$RUNNER_TEMP/sql-agent-checkpoint-w/sql-agent-native-windows/workbench-evidence.json" \
            --manual "$RUNNER_TEMP/sql-agent-checkpoint-w/manual-attestation.json" \
            --capture-run "$RUNNER_TEMP/sql-agent-checkpoint-w/capture-run.json" \
            --output "$RUNNER_TEMP/sql-agent-checkpoint-w/phase-a4-checkpoint-w.json" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-revision "$SOURCE_REVISION" \
            --expected-ref "$SOURCE_REF"

      - name: Publish Checkpoint W summary
        if: always()
        run: |
          echo '## SQL Agent Checkpoint W' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/sql-agent-checkpoint-w/phase-a4-checkpoint-w.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate Checkpoint W evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-agent-checkpoint-w
          path: ${{ runner.temp }}/sql-agent-checkpoint-w
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Enforce Checkpoint W decision
        if: steps.checkpoint-w.outcome == 'failure'
        run: |
          echo 'Checkpoint W remains NO-GO. Inspect the aggregate artifact and workflow summary.' >&2
          exit 1
