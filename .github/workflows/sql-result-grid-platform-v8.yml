name: SQL Result Grid Frame-Aware v8 Platform Evidence

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: 'Runs per workload and renderer'
        required: false
        default: '5'
        type: string
      macos_runner:
        description: 'GitHub-hosted or self-hosted macOS runner label'
        required: false
        default: 'macos-14'
        type: string
      windows_runner:
        description: 'GitHub-hosted or self-hosted Windows runner label'
        required: false
        default: 'windows-2022'
        type: string

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

concurrency:
  group: sql-result-grid-platform-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-zeus:
    name: Prepare temporary Zeus v8 audit bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Initialize fail-closed Zeus audit
        run: |
          AUDIT_DIR="$RUNNER_TEMP/nyala-zeus-v8-audit"
          echo "AUDIT_DIR=$AUDIT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$AUDIT_DIR"
          node -e "const fs=require('node:fs');const provenance={repository:process.env.GITHUB_REPOSITORY,sourceRevision:process.env.GITHUB_SHA,sourceRef:process.env.GITHUB_REF,workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT)};fs.writeFileSync(process.env.AUDIT_DIR+'/zeus-audit.json',JSON.stringify({version:1,status:'blocked',provenance,reasons:['The Zeus v8 dependency audit did not complete.']},null,2)+'\n')"
        env:
          AUDIT_DIR: ${{ runner.temp }}/nyala-zeus-v8-audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle pinned Zeus data grid
        shell: bash
        run: |
          printf '{"name":"nyala-zeus-v8-audit","private":true}\n' > "$AUDIT_DIR/package.json"
          version='0.1.0-beta.32'
          pnpm add --dir "$AUDIT_DIR" --save-exact "@zeus-web/data-grid@$version" esbuild@0.28.1
          pnpm view "@zeus-web/data-grid@$version" name version license dist.integrity dist.unpackedSize dependencies peerDependencies --json > "$AUDIT_DIR/registry.json"
          entry="$AUDIT_DIR/node_modules/@zeus-web/data-grid/dist/wc/auto.js"
          test -f "$entry"
          "$AUDIT_DIR/node_modules/.bin/esbuild" "$entry" --bundle --format=iife --platform=browser --minify --legal-comments=none --outfile="$AUDIT_DIR/data-grid-bundle.js"
          node scripts/create-sql-result-grid-zeus-audit.mjs \
            --package-json "$AUDIT_DIR/node_modules/@zeus-web/data-grid/package.json" \
            --registry-json "$AUDIT_DIR/registry.json" \
            --bundle "$AUDIT_DIR/data-grid-bundle.js" \
            --output "$AUDIT_DIR/zeus-audit.json" \
            --expected-version "$version" \
            --repository "$GITHUB_REPOSITORY" \
            --source-revision "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload v8 Zeus audit inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-result-grid-v8-zeus-audit
          path: |
            ${{ runner.temp }}/nyala-zeus-v8-audit/data-grid-bundle.js
            ${{ runner.temp }}/nyala-zeus-v8-audit/zeus-audit.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  macos-webkit:
    name: macOS WKWebView v8 benchmark
    needs: prepare-zeus
    if: always()
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 120
    steps:
      - name: Initialize fail-closed evidence
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/sql-result-grid-v8-macos-webkit"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR/screenshots"
          node -e "const fs=require('node:fs');const dir=process.env.EVIDENCE_DIR;const provenance={repository:process.env.GITHUB_REPOSITORY,sourceRevision:process.env.GITHUB_SHA,sourceRef:process.env.GITHUB_REF,workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT)};fs.writeFileSync(dir+'/platform-evidence.json',JSON.stringify({version:3,measurementContractVersion:8,status:'blocked',runs:0,label:'macOS WebKit',platformName:'macos',provenance,records:[],summary:{},reason:'The v8 native benchmark did not complete.'},null,2)+'\n')"
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/sql-result-grid-v8-macos-webkit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install dependencies and build app
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec tauri build --debug --features webdriver --no-bundle --ci --config '{"build":{"beforeBuildCommand":""}}' -- --locked
          test -x "$GITHUB_WORKSPACE/target/debug/sql-studio-next"
      - name: Download v8 Zeus bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sql-result-grid-v8-zeus-audit
          path: ${{ runner.temp }}/nyala-zeus-v8-audit
      - name: Run same-execution frame-aware benchmark
        run: |
          node scripts/benchmark-sql-result-grid-webdriver.mjs \
            --app-binary "$GITHUB_WORKSPACE/target/debug/sql-studio-next" \
            --platform macos \
            --renderer workbench-table,zeus \
            --repeat "${{ inputs.repeat || '5' }}" \
            --run-budget-ms 4200000 \
            --frame-aware true \
            --trace-profile false \
            --same-execution-profile false \
            --instrument-baseline false \
            --runtime-counters false \
            --zeus-bundle "$RUNNER_TEMP/nyala-zeus-v8-audit/data-grid-bundle.js" \
            --repository "$GITHUB_REPOSITORY" \
            --source-revision "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$EVIDENCE_DIR/platform-evidence.json" \
            --screenshot-dir "$EVIDENCE_DIR/screenshots" \
            --app-log "$EVIDENCE_DIR/nyala-app.log"
      - name: Upload v8 macOS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-result-grid-v8-macos-webkit
          path: ${{ runner.temp }}/sql-result-grid-v8-macos-webkit
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  windows-webview2:
    name: Windows WebView2 v8 benchmark
    needs: prepare-zeus
    if: always()
    runs-on: ${{ inputs.windows_runner }}
    timeout-minutes: 120
    steps:
      - name: Initialize fail-closed evidence
        shell: pwsh
        run: |
          $env:EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'sql-result-grid-v8-windows-webview2'
          "EVIDENCE_DIR=$env:EVIDENCE_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path (Join-Path $env:EVIDENCE_DIR 'screenshots') | Out-Null
          node -e "const fs=require('node:fs');const dir=process.env.EVIDENCE_DIR;const provenance={repository:process.env.GITHUB_REPOSITORY,sourceRevision:process.env.GITHUB_SHA,sourceRef:process.env.GITHUB_REF,workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT)};fs.writeFileSync(dir+'/platform-evidence.json',JSON.stringify({version:3,measurementContractVersion:8,status:'blocked',runs:0,label:'Windows WebView2',platformName:'windows',provenance,records:[],summary:{},reason:'The v8 native benchmark did not complete.'},null,2)+'\n')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install dependencies and build app
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          $config = Join-Path $env:RUNNER_TEMP 'tauri-webdriver.json'
          '{"build":{"beforeBuildCommand":""}}' | Set-Content -Path $config -Encoding utf8
          pnpm exec tauri build --debug --features webdriver --no-bundle --ci --config $config -- --locked
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'target\debug\sql-studio-next.exe') -PathType Leaf)) { throw 'v8 WebView2 binary was not created' }
      - name: Download v8 Zeus bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sql-result-grid-v8-zeus-audit
          path: ${{ runner.temp }}/nyala-zeus-v8-audit
      - name: Run same-execution frame-aware benchmark
        shell: pwsh
        run: |
          node scripts/benchmark-sql-result-grid-webdriver.mjs `
            --app-binary "$env:GITHUB_WORKSPACE\target\debug\sql-studio-next.exe" `
            --platform windows `
            --renderer workbench-table,zeus `
            --repeat "${{ inputs.repeat || '5' }}" `
            --run-budget-ms 4200000 `
            --frame-aware true `
            --trace-profile false `
            --same-execution-profile false `
            --instrument-baseline false `
            --runtime-counters false `
            --zeus-bundle "$env:RUNNER_TEMP\nyala-zeus-v8-audit\data-grid-bundle.js" `
            --repository "$env:GITHUB_REPOSITORY" `
            --source-revision "$env:GITHUB_SHA" `
            --source-ref "$env:GITHUB_REF" `
            --workflow-run-id "$env:GITHUB_RUN_ID" `
            --workflow-run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --output "$env:EVIDENCE_DIR\platform-evidence.json" `
            --screenshot-dir "$env:EVIDENCE_DIR\screenshots" `
            --app-log "$env:EVIDENCE_DIR\nyala-app.log"
      - name: Upload v8 Windows evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-result-grid-v8-windows-webview2
          path: ${{ runner.temp }}/sql-result-grid-v8-windows-webview2
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  aggregate-v8-gate:
    name: Aggregate v8 evidence and run frame-aware gate
    needs: [macos-webkit, windows-webview2]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Initialize fail-closed gate
        run: |
          EVIDENCE_ROOT="$RUNNER_TEMP/sql-result-grid-v8-evidence"
          echo "EVIDENCE_ROOT=$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_ROOT"
          node -e "const fs=require('node:fs');fs.writeFileSync(process.env.EVIDENCE_ROOT+'/phase-z1-gate-v8.json',JSON.stringify({version:1,gateContract:'z1-v8-frame-aware',measurementContractVersion:8,decision:'NO-GO',reasons:['The v8 aggregate gate did not complete.']},null,2)+'\n')"
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/sql-result-grid-v8-evidence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download v8 platform evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sql-result-grid-v8-*
          path: ${{ runner.temp }}/sql-result-grid-v8-evidence
          merge-multiple: false
      - name: Merge platform evidence
        run: |
          node scripts/merge-sql-result-grid-platform-evidence.mjs \
            --macos "$EVIDENCE_ROOT/sql-result-grid-v8-macos-webkit/platform-evidence.json" \
            --windows "$EVIDENCE_ROOT/sql-result-grid-v8-windows-webview2/platform-evidence.json" \
            --output "$EVIDENCE_ROOT/platform-evidence-v8.json"
      - id: v8-gate
        name: Recompute fail-closed v8 gate
        continue-on-error: true
        env:
          NYALA_EXPECTED_REPOSITORY: ${{ github.repository }}
          NYALA_EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          NYALA_EXPECTED_SOURCE_REF: ${{ github.ref }}
          NYALA_EXPECTED_WORKFLOW_RUN_ID: ${{ github.run_id }}
          NYALA_EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node scripts/verify-sql-result-grid-gate-v8.mjs \
            "$EVIDENCE_ROOT/platform-evidence-v8.json" \
            "$EVIDENCE_ROOT/phase-z1-gate-v8.json"
      - name: Publish v8 gate decision
        if: always()
        run: |
          echo '## SQL Result Grid v8 Frame-Aware Gate' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$EVIDENCE_ROOT/phase-z1-gate-v8.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload v8 aggregate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-result-grid-v8-platform-gate
          path: ${{ runner.temp }}/sql-result-grid-v8-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 14
