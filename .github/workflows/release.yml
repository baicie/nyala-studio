name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to release (e.g. 0.0.1-dev.0)'
        required: true
        default: '0.0.1-dev.0'
      run_mysql_integration:
        description: 'Run the opt-in MySQL 8 integration test'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  # Nyala Studio retarget. The previous workflow shipped artifacts
  # to `siden-assets/releases/sidex/...` and used `SideX v*` as the
  # GitHub Release title; AGENTS.md forbids upstream SideX
  # endpoints in this fork. The bucket, path segment, base CDN
  # URL, and product label are parameterised so a future rename
  # stays a one-file change. Override per-run via
  # `vars.NYALA_*` repository variables if the defaults don't
  # match the maintainer's CDN contract.
  NYALA_R2_BUCKET: ${{ vars.NYALA_R2_BUCKET || 'nyala-assets' }}
  NYALA_R2_RELEASE_PATH: ${{ vars.NYALA_R2_RELEASE_PATH || 'nyala' }}
  NYALA_CDN_BASE_URL: ${{ vars.NYALA_CDN_BASE_URL || 'https://cdn.nyala.studio/releases/nyala/latest' }}
  NYALA_PRODUCT_NAME: ${{ vars.NYALA_PRODUCT_NAME || 'Nyala Studio' }}

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      windows_bundles: ${{ steps.release.outputs.windows_bundles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: release
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${RAW_VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo 'Release version must not be empty.' >&2
            exit 1
          fi

          node scripts/release-version.mjs check "$VERSION"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_name }}" != "mvp" ]; then
            echo 'Manual releases must run from the protected mvp branch.' >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/mvp; then
            echo 'Release tags must point to a commit contained in origin/mvp.' >&2
            exit 1
          fi

          node scripts/release-version.mjs metadata "$VERSION" >> "$GITHUB_OUTPUT"

  gate:
    name: SQL MVP gate
    uses: ./.github/workflows/sql-mvp-gate.yml
    with:
      run_mysql_integration: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mysql_integration }}

  build:
    needs: [gate, metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            artifact_name: macos-arm64

          - platform: macos-latest
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            artifact_name: macos-x64

          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact_name: macos-universal

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact_name: windows-x64

          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            artifact_name: windows-arm64

          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            artifact_name: linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect optional signing configuration
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          APPLE=false
          UPDATER=false
          AZURE=false
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$KEYCHAIN_PASSWORD" ]; then
            APPLE=true
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            UPDATER=true
          fi
          if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_SIGNING_ENDPOINT" ] && [ -n "$AZURE_SIGNING_ACCOUNT" ] && [ -n "$AZURE_CERT_PROFILE" ]; then
            AZURE=true
          fi
          echo "apple=$APPLE" >> "$GITHUB_OUTPUT"
          echo "updater=$UPDATER" >> "$GITHUB_OUTPUT"
          echo "azure=$AZURE" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libfuse2 \
            rpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm run release:check -- "${{ needs.metadata.outputs.version }}"

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain login.keychain
          rm certificate.p12

      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          sudo ln -sf "$(which create-dmg)" /usr/local/bin/create-dmg

      - name: Setup built-in extensions
        shell: bash
        run: bash scripts/setup-extensions.sh

      - name: Build frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=12288'
        run: pnpm run build

      - name: Unlock keychain before signing
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

      - name: Build signed macOS updater artifacts
        if: runner.os == 'macOS' && steps.signing.outputs.updater == 'true'
        timeout-minutes: 40
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm exec tauri build --ci
          --target ${{ matrix.target }}
          --config src-tauri/tauri.release.conf.json

      - name: Build signed Windows updater artifacts
        if: runner.os == 'Windows' && steps.signing.outputs.updater == 'true'
        timeout-minutes: 40
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm exec tauri build --ci
          --target ${{ matrix.target }}
          --bundles ${{ needs.metadata.outputs.windows_bundles }}
          --config src-tauri/tauri.release.conf.json

      - name: Build signed Linux updater artifacts
        if: runner.os == 'Linux' && steps.signing.outputs.updater == 'true'
        timeout-minutes: 40
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm exec tauri build --ci
          --target ${{ matrix.target }}
          --config src-tauri/tauri.release.conf.json

      - name: Build Apple-signed artifacts without updater packages
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true' && steps.signing.outputs.updater != 'true'
        timeout-minutes: 40
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec tauri build --ci --target ${{ matrix.target }}

      - name: Build unsigned Windows development artifacts
        if: runner.os == 'Windows' && steps.signing.outputs.updater != 'true'
        timeout-minutes: 40
        run: >-
          pnpm exec tauri build --ci --no-sign
          --target ${{ matrix.target }}
          --bundles ${{ needs.metadata.outputs.windows_bundles }}

      - name: Build unsigned development artifacts
        if: runner.os != 'Windows' && steps.signing.outputs.updater != 'true' && (runner.os != 'macOS' || steps.signing.outputs.apple != 'true')
        timeout-minutes: 40
        run: pnpm exec tauri build --ci --no-sign --target ${{ matrix.target }}

      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find target \( \
            -name "*.dmg" \
            -o -name "*.app.tar.gz" \
            -o -name "*.app.tar.gz.sig" \
          \) -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          ls -la dist-artifacts/

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find target \( \
            -name "*-setup.exe" \
            -o -name "*.msi" \
            -o -name "*.exe.zip" \
            -o -name "*.exe.zip.sig" \
          \) -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          ls -la dist-artifacts/

      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find target \( \
            -name "*.deb" \
            -o -name "*.rpm" \
            -o -name "*.AppImage" \
            -o -name "*.AppImage.tar.gz" \
            -o -name "*.AppImage.tar.gz.sig" \
          \) -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          ls -la dist-artifacts/

      - name: Namespace artifact filenames
        shell: bash
        run: |
          for path in dist-artifacts/*; do
            [ -f "$path" ] || continue
            filename=$(basename "$path")
            mv "$path" "dist-artifacts/${{ matrix.artifact_name }}-$filename"
          done

      - name: Verify collected artifacts
        shell: bash
        run: |
          if [ -z "$(find dist-artifacts -type f -print -quit)" ]; then
            echo "No release artifacts were collected for ${{ matrix.artifact_name }}." >&2
            exit 1
          fi

      - name: Sign Windows installers (Azure Trusted Signing)
        if: runner.os == 'Windows' && steps.signing.outputs.azure == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist-artifacts
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-artifacts/
          retention-days: 7
          if-no-files-found: error

  # ── Deploy to Cloudflare R2 ──────────────────────────────────────────────────
  deploy:
    needs: [build, metadata]
    runs-on: ubuntu-latest
    steps:
      - name: Detect optional R2 deployment
        id: r2
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_ACCOUNT_ID" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare R2 credentials found; versioned artifacts will be uploaded.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare R2 credentials are not configured; GitHub Release remains the publication target.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download all build artifacts
        if: steps.r2.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Detect updater artifacts
        if: steps.r2.outputs.enabled == 'true'
        id: updater
        shell: bash
        run: |
          if [ -n "$(find all-artifacts -type f -name '*.sig' -print -quit)" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: List files
        if: steps.r2.outputs.enabled == 'true'
        run: find all-artifacts -type f | sort

      - name: Configure AWS CLI for R2
        if: steps.r2.outputs.enabled == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set default.region auto

      - name: Upload to R2 — versioned folder
        if: steps.r2.outputs.enabled == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          aws s3 sync all-artifacts/ \
            "s3://${NYALA_R2_BUCKET}/releases/${NYALA_R2_RELEASE_PATH}/${VERSION}/" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --delete

      - name: Upload to R2 — overwrite latest
        if: >-
          steps.r2.outputs.enabled == 'true' &&
          needs.metadata.outputs.prerelease == 'false' &&
          steps.updater.outputs.enabled == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 sync all-artifacts/ \
            "s3://${NYALA_R2_BUCKET}/releases/${NYALA_R2_RELEASE_PATH}/latest/" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --delete

      - name: Generate and upload latest.json
        if: >-
          steps.r2.outputs.enabled == 'true' &&
          needs.metadata.outputs.prerelease == 'false' &&
          steps.updater.outputs.enabled == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE_URL="${NYALA_CDN_BASE_URL}"

          MACOS_ARM64_PATH=$(find all-artifacts -maxdepth 1 -type f -name 'macos-arm64-*.app.tar.gz' -print -quit)
          MACOS_X64_PATH=$(find all-artifacts -maxdepth 1 -type f -name 'macos-x64-*.app.tar.gz' -print -quit)
          WIN_X64_PATH=$(find all-artifacts -maxdepth 1 -type f -name 'windows-x64-*.exe.zip' -print -quit)
          WIN_ARM64_PATH=$(find all-artifacts -maxdepth 1 -type f -name 'windows-arm64-*.exe.zip' -print -quit)
          LINUX_X64_PATH=$(find all-artifacts -maxdepth 1 -type f -name 'linux-x64-*.AppImage.tar.gz' -print -quit)

          for path in "$MACOS_ARM64_PATH" "$MACOS_X64_PATH" "$WIN_X64_PATH" "$WIN_ARM64_PATH" "$LINUX_X64_PATH"; do
            if [ ! -s "$path" ] || [ ! -s "$path.sig" ]; then
              echo "Updater artifact or signature is missing: $path" >&2
              exit 1
            fi
          done

          MACOS_ARM64_SIG=$(cat "$MACOS_ARM64_PATH.sig")
          MACOS_ARM64_FILE=$(basename "$MACOS_ARM64_PATH")
          MACOS_X64_SIG=$(cat "$MACOS_X64_PATH.sig")
          MACOS_X64_FILE=$(basename "$MACOS_X64_PATH")
          WIN_X64_SIG=$(cat "$WIN_X64_PATH.sig")
          WIN_X64_FILE=$(basename "$WIN_X64_PATH")
          WIN_ARM64_SIG=$(cat "$WIN_ARM64_PATH.sig")
          WIN_ARM64_FILE=$(basename "$WIN_ARM64_PATH")
          LINUX_X64_SIG=$(cat "$LINUX_X64_PATH.sig")
          LINUX_X64_FILE=$(basename "$LINUX_X64_PATH")

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See the full changelog at https://github.com/${{ github.repository }}/releases/tag/v${VERSION}",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": { "signature": "${MACOS_ARM64_SIG}", "url": "${BASE_URL}/${MACOS_ARM64_FILE}" },
              "darwin-x86_64": { "signature": "${MACOS_X64_SIG}", "url": "${BASE_URL}/${MACOS_X64_FILE}" },
              "windows-x86_64": { "signature": "${WIN_X64_SIG}", "url": "${BASE_URL}/${WIN_X64_FILE}" },
              "windows-aarch64": { "signature": "${WIN_ARM64_SIG}", "url": "${BASE_URL}/${WIN_ARM64_FILE}" },
              "linux-x86_64": { "signature": "${LINUX_X64_SIG}", "url": "${BASE_URL}/${LINUX_X64_FILE}" }
            }
          }
          EOF

          aws s3 cp latest.json \
            "s3://${NYALA_R2_BUCKET}/releases/${NYALA_R2_RELEASE_PATH}/latest/latest.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/json" \
            --cache-control "no-cache"

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    needs: [build, metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-artifacts

      - name: Verify release artifact matrix
        shell: bash
        run: |
          for artifact in macos-arm64 macos-x64 macos-universal windows-x64 windows-arm64 linux-x64; do
            if [ -z "$(find "all-artifacts/$artifact" -type f -print -quit 2>/dev/null)" ]; then
              echo "Release artifact is missing or empty: $artifact" >&2
              exit 1
            fi
          done
          find all-artifacts -type f | sort

      - name: Prepare release assets and SHA-256 checksums
        shell: bash
        run: |
          mkdir -p release-assets
          find all-artifacts -mindepth 2 -maxdepth 2 -type f -exec cp {} release-assets/ \;

          INPUT_COUNT=$(find all-artifacts -mindepth 2 -maxdepth 2 -type f | wc -l | tr -d ' ')
          OUTPUT_COUNT=$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$INPUT_COUNT" != "$OUTPUT_COUNT" ]; then
            echo 'Release artifact filenames are not unique.' >&2
            exit 1
          fi

          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > release-assets/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: '${{ needs.metadata.outputs.tag }}'
          target_commitish: '${{ github.sha }}'
          name: '${{ env.NYALA_PRODUCT_NAME }} v${{ needs.metadata.outputs.version }}'
          body: |
            Release packages for installation and smoke testing.

            Packages may be unsigned when platform signing secrets are not configured. Verify downloads against `SHA256SUMS.txt` before installation.
          draft: false
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          make_latest: ${{ needs.metadata.outputs.prerelease == 'false' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
