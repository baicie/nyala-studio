name: SQL Result Grid Native WebView Evidence

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: 'Runs per workload and renderer'
        required: false
        default: '5'
        type: string
      macos_runner:
        description: 'GitHub-hosted or self-hosted macOS runner label'
        required: false
        default: 'macos-14'
        type: string
      windows_runner:
        description: 'GitHub-hosted or self-hosted Windows runner label'
        required: false
        default: 'windows-2022'
        type: string
      windows_recovery_probe:
        description: 'Run only the 10k native -> narrow-panel Windows app recovery probe; skips macOS and the Z1 gate.'
        required: false
        default: false
        type: boolean
      instrument_baseline:
        description: 'Instrument the baseline renderer to capture commit work (diagnostic evidence only, never v7 admission)'
        required: false
        default: 'false'
        type: string
      same_execution_profile:
        description: 'Record input, renderer commits and existing presentation wait in the same scroll execution. Requires instrument_baseline=true; diagnostic only.'
        required: false
        default: 'false'
        type: string
      text_churn:
        description: 'Explicit diagnostic DOM observer in trace navigation only; never admission.'
        required: false
        default: 'false'
        type: string
      zeus_package_version:
        description: 'data-grid version to measure. Defaults to the version this workflow pins. Overrides collect control evidence and are never gated.'
        required: false
        type: string
      zeus_variant:
        description: 'Interleaved data-grid versions as id=version,id=version. Each version plus the pinned version is measured inside one WebView session so host drift hits them all. Diagnostic paired evidence, never gated.'
        required: false
        type: string
      zeus_css_package_version:
        description: 'Measure with the real @zeus-web/themes components.css from this version instead of the benchmark inline stylesheet. Empty keeps the historical inline-CSS page. Diagnostic evidence, never gated.'
        required: false
        type: string
      zeus_cell_layout_variant:
        description: 'Diagnostic only: append block + centered cell CSS to this requested variant id. Requires zeus_variant; never admission.'
        required: false
        type: string
      zeus_fixed_capacity_variant:
        description: 'Diagnostic only: reduce the fixed row capacity in this requested variant id. Requires zeus_variant; never admission.'
        required: false
        type: string
      diagnostic_renderers:
        description: 'Renderer subset for paired diagnostics, e.g. zeus,workbench-table. Requires zeus_variant; never admission.'
        required: false
        type: string
      native_wheel_smoke:
        description: 'Build the Zeus fixture and verify OS-native wheel delivery on both embedded WebViews; skips performance benchmarking and the Z1 gate.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

concurrency:
  group: sql-result-grid-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-zeus:
    name: Prepare temporary Zeus audit bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Initialize fail-closed Zeus audit
        run: |
          AUDIT_DIR="$RUNNER_TEMP/nyala-zeus-audit"
          export AUDIT_DIR
          echo "AUDIT_DIR=$AUDIT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$AUDIT_DIR"
          node -e "const fs=require('node:fs');const provenance={repository:process.env.GITHUB_REPOSITORY,sourceRevision:process.env.GITHUB_SHA,sourceRef:process.env.GITHUB_REF,workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT)};const report={version:1,generatedAt:new Date().toISOString(),status:'blocked',provenance,checks:[],reasons:['The Zeus dependency audit or Chromium benchmark did not complete.']};fs.writeFileSync(process.env.AUDIT_DIR+'/zeus-audit.json',JSON.stringify(report,null,2)+'\n');"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Zeus only in a temporary directory
        shell: bash
        env:
          CELL_LAYOUT_VARIANT: ${{ inputs.zeus_cell_layout_variant }}
          FIXED_CAPACITY_VARIANT: ${{ inputs.zeus_fixed_capacity_variant }}
          ZEUS_VARIANTS: ${{ inputs.zeus_variant }}
          DIAGNOSTIC_RENDERERS: ${{ inputs.diagnostic_renderers }}
          SAME_EXECUTION_PROFILE: ${{ inputs.same_execution_profile || 'false' }}
          INSTRUMENT_BASELINE: ${{ inputs.instrument_baseline || 'false' }}
          TEXT_CHURN: ${{ inputs.text_churn || 'false' }}
        run: |
          if [ "$SAME_EXECUTION_PROFILE" = true ] && { [ "$INSTRUMENT_BASELINE" != true ] || [ "$TEXT_CHURN" = true ]; }; then
            echo 'Same-execution profiling requires instrument_baseline=true and text_churn=false.' >&2
            exit 1
          fi
          if [ -n "$CELL_LAYOUT_VARIANT" ] && [ -z "$ZEUS_VARIANTS" ]; then
            echo 'Cell layout experiment requires an interleaved variant.' >&2
            exit 1
          fi
          if [ -n "$FIXED_CAPACITY_VARIANT" ] && [ -z "$ZEUS_VARIANTS" ]; then
            echo 'Fixed capacity experiment requires an interleaved variant.' >&2
            exit 1
          fi
          if [ -n "$DIAGNOSTIC_RENDERERS" ] && [ -z "$ZEUS_VARIANTS" ] && [ "$SAME_EXECUTION_PROFILE" != true ]; then
            echo 'Renderer subsets require interleaved or same-execution diagnostics.' >&2
            exit 1
          fi
          printf '{"name":"nyala-zeus-audit","private":true}\n' > "$AUDIT_DIR/package.json"
          version="${{ inputs.zeus_package_version || '0.1.0-beta.32' }}"
          echo "Z1_AUDIT_EXPECTED_VERSION=$version" >> "$GITHUB_ENV"
          pnpm add --dir "$AUDIT_DIR" --save-exact "@zeus-web/data-grid@$version" esbuild@0.28.1
          pnpm view "@zeus-web/data-grid@$version" \
            name version license dist.integrity dist.unpackedSize dependencies peerDependencies \
            --json > "$AUDIT_DIR/registry.json"
          entry="$AUDIT_DIR/node_modules/@zeus-web/data-grid/dist/wc/auto.js"
          test -f "$entry"
          "$AUDIT_DIR/node_modules/.bin/esbuild" "$entry" \
            --bundle --format=iife --platform=browser --minify --legal-comments=none \
            --outfile="$AUDIT_DIR/data-grid-bundle.js"

          # Interleaved collection: bundle every requested variant next to the
          # pinned one so a single platform job can alternate between them inside
          # one WebView session. Two runs hours apart cannot support a 10%/20%
          # threshold when hosted runners drift by tens of percent.
          if [ -n "${{ inputs.zeus_variant }}" ]; then
            old_ifs=$IFS
            IFS=';'
            fixed_capacity_applied=false
            for pair in ${{ inputs.zeus_variant }}; do
              id="${pair%%=*}"
              version="${pair#*=}"
              [ -n "$id" ] || continue
              dir="$AUDIT_DIR/variant-$id"
              mkdir -p "$dir"
              printf '{"name":"nyala-zeus-audit-%s","private":true}\n' "$id" > "$dir/package.json"
              pnpm add --dir "$dir" --save-exact "@zeus-web/data-grid@$version" esbuild@0.28.1
              "$dir/node_modules/.bin/esbuild" "$dir/node_modules/@zeus-web/data-grid/dist/wc/auto.js" \
                --bundle --format=iife --platform=browser --minify --legal-comments=none \
                --outfile="$AUDIT_DIR/variant-$id.js"
              if [ -n "$CELL_LAYOUT_VARIANT" ] && [ "$id" = "$CELL_LAYOUT_VARIANT" ]; then
                node --input-type=module -e 'import {readFile,writeFile} from "node:fs/promises"; import {appendBlockCellLayout} from "./scripts/sql-result-grid-cell-layout-variant.mjs"; const p=process.argv[1]; await writeFile(p,appendBlockCellLayout(await readFile(p,"utf8")));' "$AUDIT_DIR/variant-$id.js"
                cell_layout_applied=true
              fi
              if [ -n "$FIXED_CAPACITY_VARIANT" ] && [ "$id" = "$FIXED_CAPACITY_VARIANT" ]; then
                node scripts/sql-result-grid-fixed-capacity-variant.mjs "$AUDIT_DIR/variant-$id.js"
                fixed_capacity_applied=true
              fi
              npm view "@zeus-web/data-grid@$version" version --json > "$AUDIT_DIR/variant-$id.registry.json"
            done
            IFS=$old_ifs
          fi
          if [ -n "$CELL_LAYOUT_VARIANT" ] && [ "${cell_layout_applied:-false}" != true ]; then
            echo 'Requested cell layout variant was not built.' >&2
            exit 1
          fi
          if [ -n "$FIXED_CAPACITY_VARIANT" ] && [ "${fixed_capacity_applied:-false}" != true ]; then
            echo 'Requested fixed capacity variant was not built.' >&2
            exit 1
          fi

          # The published data-grid bundle ships no stylesheet, so the benchmark
          # page's inline block is normally the only styling under test. Copy the
          # real product CSS out of the same version so a CSS-level candidate can
          # be measured at all, and so provenance can name the exact bytes.
          if [ -n "${{ inputs.zeus_css_package_version }}" ]; then
            css_version="${{ inputs.zeus_css_package_version }}"
            pnpm add --dir "$AUDIT_DIR" --save-exact "@zeus-web/themes@$css_version"
            css_file="$AUDIT_DIR/node_modules/@zeus-web/themes/dist/components.css"
            test -f "$css_file"
            cp "$css_file" "$AUDIT_DIR/zeus-product.css"
          fi

      - name: Create structured dependency audit
        run: |
          node scripts/create-sql-result-grid-zeus-audit.mjs \
            --package-json "$AUDIT_DIR/node_modules/@zeus-web/data-grid/package.json" \
            --registry-json "$AUDIT_DIR/registry.json" \
            --bundle "$AUDIT_DIR/data-grid-bundle.js" \
            --output "$AUDIT_DIR/zeus-audit.json" \
            ${Z1_AUDIT_EXPECTED_VERSION:+--expected-version "$Z1_AUDIT_EXPECTED_VERSION"} \
            --repository "$GITHUB_REPOSITORY" \
            --source-revision "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Run revision-bound Chromium characterization
        if: ${{ !inputs.native_wheel_smoke }}
        run: |
          node scripts/benchmark-sql-result-grid.mjs \
            --renderer all \
            --repeat 3 \
            --diagnostic-profile true \
            --floor-only true \
            --workbench-table-implementation real \
            --require-zeus true \
            --zeus-bundle "$AUDIT_DIR/data-grid-bundle.js" \
            --output "$AUDIT_DIR/phase-z1-benchmark.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-revision "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload temporary Zeus audit inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-result-grid-zeus-audit
          path: |
            ${{ runner.temp }}/nyala-zeus-audit/data-grid-bundle.js
            ${{ runner.temp }}/nyala-zeus-audit/variant-*.js
            ${{ runner.temp }}/nyala-zeus-audit/variant-*.registry.json
            ${{ runner.temp }}/nyala-zeus-audit/zeus-product.css
            ${{ runner.temp }}/nyala-zeus-audit/zeus-audit.json
            ${{ runner.temp }}/nyala-zeus-audit/phase-z1-benchmark.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  macos-webkit:
    name: macOS WKWebView benchmark and screenshots
    needs: prepare-zeus
    if: ${{ always() && !inputs.windows_recovery_probe }}
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 120
    steps:
      - name: Initialize fail-closed evidence
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/macos-webkit-evidence"
          export EVIDENCE_DIR
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          node -e "const fs=require('node:fs');const dir=process.env.EVIDENCE_DIR;fs.mkdirSync(dir+'/screenshots',{recursive:true});const provenance={repository:process.env.GITHUB_REPOSITORY,sourceRevision:process.env.GITHUB_SHA,sourceRef:process.env.GITHUB_REF,workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT)};const report={version:2,measurementContractVersion:7,scrollCommitBoundary:'post-presentation-opportunity',executionOrder:'renderer-balanced-rotation-v1',generatedAt:new Date().toISOString(),label:'macOS WebKit',status:'blocked',runs:0,reason:'The native WKWebView build or benchmark did not complete.',driverProvider:'embedded',nativeWebView:false,nativeWebView2:false,engine:'embedded-unverified',browser:'unknown',platformName:'macos',provenance,summary:{},records:[],screenshots:[]};fs.writeFileSync(dir+'/platform-evidence.json',JSON.stringify(report,null,2)+'\n');fs.writeFileSync(dir+'/nyala-app.log','Nyala native benchmark did not start.\n');"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: '. -> target'
          key: sql-result-grid-webdriver-macos

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download temporary Zeus bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sql-result-grid-zeus-audit
          path: ${{ runner.temp }}/nyala-zeus-audit

      - name: Build frontend
        run: pnpm run build

      - name: Build webdriver-enabled Nyala debug binary
        run: >-
          pnpm exec tauri build --debug --features webdriver --no-bundle --ci
          --config '{"build":{"beforeBuildCommand":""}}' -- --locked

      - name: Verify native binary
        run: test -x "$GITHUB_WORKSPACE/target/debug/sql-studio-next"

      - name: Run diagnostic native wheel smoke
        if: ${{ inputs.native_wheel_smoke }}
        run: |
          node scripts/sql-result-grid-native-wheel-smoke.mjs \
            --platform macos \
            --app-binary "$GITHUB_WORKSPACE/target/debug/sql-studio-next" \
            --zeus-bundle "$RUNNER_TEMP/nyala-zeus-audit/data-grid-bundle.js" \
            --output "$EVIDENCE_DIR/native-wheel-smoke.json" \
            --app-log "$EVIDENCE_DIR/native-wheel-smoke-app.log"

      - name: Run embedded WKWebView benchmark
        if: ${{ !inputs.native_wheel_smoke }}
        env:
          BENCHMARK_REPEAT: ${{ inputs.repeat || '5' }}
          ZEUS_VARIANTS: ${{ inputs.zeus_variant }}
          DIAGNOSTIC_RENDERERS: ${{ inputs.diagnostic_renderers }}
          TEXT_CHURN: ${{ inputs.text_churn || 'false' }}
          INSTRUMENT_BASELINE: ${{ inputs.instrument_baseline || 'false' }}
          SAME_EXECUTION_PROFILE: ${{ inputs.same_execution_profile || 'false' }}
        run: |
          TRACE_PROFILE=true
          if [ "$SAME_EXECUTION_PROFILE" = true ]; then TRACE_PROFILE=false; fi
          VARIANT_ARGS=""
          if [ -n "$ZEUS_VARIANTS" ]; then
            OLD_IFS=$IFS
            IFS=';'
            VARIANT_ARGS="--zeus-variant pinned=$RUNNER_TEMP/nyala-zeus-audit/data-grid-bundle.js"
            for pair in $ZEUS_VARIANTS; do
              id="${pair%%=*}"
              [ -n "$id" ] || continue
              VARIANT_ARGS="$VARIANT_ARGS,$id=$RUNNER_TEMP/nyala-zeus-audit/variant-$id.js"
            done
            IFS=$OLD_IFS
          fi
          CSS_ARGS=""
          if [ -f "$RUNNER_TEMP/nyala-zeus-audit/zeus-product.css" ]; then
            CSS_ARGS="--zeus-css $RUNNER_TEMP/nyala-zeus-audit/zeus-product.css"
          fi
          node scripts/benchmark-sql-result-grid-webdriver.mjs \
            --app-binary "$GITHUB_WORKSPACE/target/debug/sql-studio-next" \
            --platform macos \
            --renderer "${{ inputs.diagnostic_renderers || 'all' }}" \
            --repeat "$BENCHMARK_REPEAT" \
            --run-budget-ms 4200000 \
            --zeus-bundle "$RUNNER_TEMP/nyala-zeus-audit/data-grid-bundle.js" \
            $VARIANT_ARGS \
            $CSS_ARGS \
            --trace-profile "$TRACE_PROFILE" \
            --same-execution-profile "$SAME_EXECUTION_PROFILE" \
            --text-churn "$TEXT_CHURN" \
            --instrument-baseline "$INSTRUMENT_BASELINE" \
            --repository "$GITHUB_REPOSITORY" \
            --source-revision "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$EVIDENCE_DIR/platform-evidence.json" \
            --screenshot-dir "$EVIDENCE_DIR/screenshots" \
            --app-log "$EVIDENCE_DIR/nyala-app.log"

      - name: Upload macOS evidence, screenshots, and app log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-result-grid-macos-webkit
          path: ${{ runner.temp }}/macos-webkit-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  windows-webview2:
    name: Windows WebView2 benchmark and screenshots
    needs: prepare-zeus
    if: always()
    runs-on: ${{ inputs.windows_runner }}
    timeout-minutes: 120
    steps:
      - name: Initialize fail-closed evidence
        shell: pwsh
        run: |
          $env:EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'windows-webview2-evidence'
          "EVIDENCE_DIR=$env:EVIDENCE_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node -e "const fs=require('node:fs');const dir=process.env.EVIDENCE_DIR;fs.mkdirSync(dir+'/screenshots',{recursive:true});const provenance={repository:process.env.GITHUB_REPOSITORY,sourceRevision:process.env.GITHUB_SHA,sourceRef:process.env.GITHUB_REF,workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT)};const report={version:2,measurementContractVersion:7,scrollCommitBoundary:'post-presentation-opportunity',executionOrder:'renderer-balanced-rotation-v1',generatedAt:new Date().toISOString(),label:'Windows WebView2',status:'blocked',runs:0,reason:'The native WebView2 build or benchmark did not complete.',driverProvider:'embedded',nativeWebView:false,nativeWebView2:false,engine:'embedded-unverified',browser:'unknown',platformName:'windows',provenance,summary:{},records:[],screenshots:[]};fs.writeFileSync(dir+'/platform-evidence.json',JSON.stringify(report,null,2)+'\n');fs.writeFileSync(dir+'/nyala-app.log','Nyala native benchmark did not start.\n');"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: '. -> target'
          key: sql-result-grid-webdriver-windows

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download temporary Zeus bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sql-result-grid-zeus-audit
          path: ${{ runner.temp }}/nyala-zeus-audit

      - name: Build frontend
        run: pnpm run build

      - name: Build webdriver-enabled Nyala debug binary
        shell: pwsh
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri-webdriver.json'
          '{"build":{"beforeBuildCommand":""}}' | Set-Content -Path $configPath -Encoding utf8
          pnpm exec tauri build --debug --features webdriver --no-bundle --ci --config $configPath -- --locked

      - name: Verify native binary
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE 'target\debug\sql-studio-next.exe'
          if (-not (Test-Path $binary -PathType Leaf)) {
            throw "Nyala debug binary was not created at $binary"
          }

      - name: Run diagnostic native wheel smoke
        if: ${{ inputs.native_wheel_smoke }}
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE 'target\debug\sql-studio-next.exe'
          $bundle = Join-Path $env:RUNNER_TEMP 'nyala-zeus-audit\data-grid-bundle.js'
          $output = Join-Path $env:EVIDENCE_DIR 'native-wheel-smoke.json'
          $log = Join-Path $env:EVIDENCE_DIR 'native-wheel-smoke-app.log'
          node scripts/sql-result-grid-native-wheel-smoke.mjs `
            --platform windows `
            --app-binary $binary `
            --zeus-bundle $bundle `
            --output $output `
            --app-log $log

      - name: Run embedded WebView2 benchmark
        if: ${{ !inputs.native_wheel_smoke }}
        shell: pwsh
        env:
          BENCHMARK_REPEAT: ${{ inputs.repeat || '5' }}
          SAME_EXECUTION_PROFILE: ${{ inputs.same_execution_profile || 'false' }}
        run: |
          $traceProfile = 'true'
          if ($env:SAME_EXECUTION_PROFILE -eq 'true') { $traceProfile = 'false' }
          $renderer = "${{ inputs.diagnostic_renderers || 'all' }}"
          $workload = 'all'
          $repeat = $env:BENCHMARK_REPEAT
          $recoveryProbe = 'false'
          if ('${{ inputs.windows_recovery_probe }}' -eq 'true') {
            $renderer = 'native'
            $workload = '10k-x-50,narrow-panel'
            $repeat = '5'
            $traceProfile = 'false'
            $recoveryProbe = 'true'
          }
          $variantArgs = @()
          if ('${{ inputs.zeus_variant }}' -ne '') {
            # The parser takes a single comma-separated token, so the whole list
            # must be one argument. Passing --zeus-variant and its value as two
            # argv entries makes the value look like an unexpected argument.
            $variantList = @("pinned=$env:RUNNER_TEMP\nyala-zeus-audit\data-grid-bundle.js")
            foreach ($pair in ('${{ inputs.zeus_variant }}' -split ';')) {
              if (-not $pair) { continue }
              $id = ($pair -split '=', 2)[0]
              if (-not $id) { continue }
              $variantList += "$id=$env:RUNNER_TEMP\nyala-zeus-audit\variant-$id.js"
            }
            $variantArgs = @("--zeus-variant", ($variantList -join ','))
          }
          $cssArgs = @()
          $cssFile = Join-Path $env:RUNNER_TEMP 'nyala-zeus-audit\zeus-product.css'
          if (Test-Path $cssFile -PathType Leaf) {
            $cssArgs = @('--zeus-css', $cssFile)
          }
          node scripts/benchmark-sql-result-grid-webdriver.mjs `
            --app-binary "$env:GITHUB_WORKSPACE\target\debug\sql-studio-next.exe" `
            --platform windows `
            --renderer "$renderer" `
            --workload "$workload" `
            --repeat "$repeat" `
            --recovery-probe "$recoveryProbe" `
            --run-budget-ms 4200000 `
            --zeus-bundle "$env:RUNNER_TEMP\nyala-zeus-audit\data-grid-bundle.js" `
            @variantArgs `
            @cssArgs `
            --trace-profile "$traceProfile" `
            --same-execution-profile "$env:SAME_EXECUTION_PROFILE" `
            --text-churn "${{ inputs.text_churn || 'false' }}" `
            --instrument-baseline "${{ inputs.instrument_baseline || 'false' }}" `
            --repository "$env:GITHUB_REPOSITORY" `
            --source-revision "$env:GITHUB_SHA" `
            --source-ref "$env:GITHUB_REF" `
            --workflow-run-id "$env:GITHUB_RUN_ID" `
            --workflow-run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --output "$env:EVIDENCE_DIR\platform-evidence.json" `
            --screenshot-dir "$env:EVIDENCE_DIR\screenshots" `
            --app-log "$env:EVIDENCE_DIR\nyala-app.log"

      - name: Upload Windows evidence, screenshots, and app log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-result-grid-windows-webview2
          path: ${{ runner.temp }}/windows-webview2-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  aggregate-gate:
    name: Aggregate platform evidence and run Z1 gate
    needs: [macos-webkit, windows-webview2]
    if: ${{ always() && !inputs.native_wheel_smoke && !inputs.windows_recovery_probe }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Initialize fail-closed aggregate gate
        run: |
          EVIDENCE_ROOT="$RUNNER_TEMP/sql-result-grid-evidence"
          export EVIDENCE_ROOT
          echo "EVIDENCE_ROOT=$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_ROOT"
          node -e "const fs=require('node:fs');const report={version:2,generatedAt:new Date().toISOString(),sourceRevision:process.env.GITHUB_SHA,decision:'NO-GO',reasons:['The aggregate Z1 gate did not complete.']};fs.writeFileSync(process.env.EVIDENCE_ROOT+'/phase-z1-gate.json',JSON.stringify(report,null,2)+'\n');"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download platform evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sql-result-grid-*
          path: ${{ runner.temp }}/sql-result-grid-evidence
          merge-multiple: false

      - name: Merge evidence
        if: ${{ inputs.same_execution_profile != 'true' && inputs.instrument_baseline != 'true' && inputs.text_churn != 'true' && inputs.zeus_package_version == '' && inputs.zeus_variant == '' && inputs.zeus_css_package_version == '' }}
        run: |
          node scripts/merge-sql-result-grid-platform-evidence.mjs \
            --macos "$RUNNER_TEMP/sql-result-grid-evidence/sql-result-grid-macos-webkit/platform-evidence.json" \
            --windows "$RUNNER_TEMP/sql-result-grid-evidence/sql-result-grid-windows-webview2/platform-evidence.json" \
            --output "$RUNNER_TEMP/sql-result-grid-evidence/platform-evidence.json"

      # An instrumented-baseline run carries observer overhead inside
      # scrollP95Ms, so its records cannot be scored for v7 admission. Skipping
      # the gate keeps a fail-closed NO-GO from being mistaken for a real result.
      # A version override collects control evidence for a paired comparison.
      # The gate scores one pinned version, so it is skipped for overrides.
      - name: Run fail-closed Z1 gate
        if: ${{ inputs.same_execution_profile != 'true' && inputs.instrument_baseline != 'true' && inputs.text_churn != 'true' && inputs.zeus_package_version == '' && inputs.zeus_variant == '' && inputs.zeus_css_package_version == '' }}
        env:
          NYALA_EXPECTED_REPOSITORY: ${{ github.repository }}
          NYALA_EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          NYALA_EXPECTED_SOURCE_REF: ${{ github.ref }}
          NYALA_EXPECTED_WORKFLOW_RUN_ID: ${{ github.run_id }}
          NYALA_EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          NYALA_ZEUS_AUDIT_EVIDENCE: ${{ runner.temp }}/sql-result-grid-evidence/sql-result-grid-zeus-audit/zeus-audit.json
        run: |
          node scripts/verify-sql-result-grid-gate.mjs \
            "$RUNNER_TEMP/sql-result-grid-evidence/sql-result-grid-zeus-audit/phase-z1-benchmark.json" \
            "$RUNNER_TEMP/sql-result-grid-evidence/phase-z1-gate.json" \
            "$RUNNER_TEMP/sql-result-grid-evidence/platform-evidence.json"

      - name: Upload aggregate gate and visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-result-grid-platform-gate
          path: ${{ runner.temp }}/sql-result-grid-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 14
